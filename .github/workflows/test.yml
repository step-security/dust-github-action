name: Test

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  test-upsert-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - run: npm ci
        working-directory: .

      - name: Build
        run: npm run build
        working-directory: .
